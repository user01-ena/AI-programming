<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプル テトリス</title>
  <style>
    body {
      background-color: #1a1a24;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .game-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      background-color: #262635;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      align-items: flex-start;
    }

    /* レスポンシブ対応：画面幅が狭い場合は縦並びに */
    @media (max-width: 480px) {
      .game-container {
        flex-direction: column;
        align-items: center;
      }
    }

    /* テトリス画面 (キャンバス) */
    #tetris {
      border: 3px solid #444460;
      background-color: #111119;
      border-radius: 6px;
      display: block;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 140px;
    }

    .info-box h2 {
      margin: 0 0 5px 0;
      font-size: 14px;
      color: #8888a0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-box p {
      margin: 0 0 20px 0;
      font-size: 28px;
      font-weight: bold;
      color: #00f0f0;
    }

    .controls-info {
      font-size: 12px;
      color: #aaaabf;
      line-height: 1.6;
      background-color: #1c1c28;
      padding: 12px;
      border-radius: 8px;
    }

    .controls-info ul {
      padding-left: 15px;
      margin: 5px 0 0 0;
    }

    .game-over {
      display: none;
      color: #ff4d4d;
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
      padding: 8px;
      background-color: rgba(255, 77, 77, 0.1);
      border-radius: 6px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- テトリスの描画領域 -->
    <canvas id="tetris" width="240" height="400"></canvas>

    <!-- 情報表示・操作説明エリア -->
    <div class="side-panel">
      <div>
        <div class="info-box">
          <h2>Score</h2>
          <p id="score">0</p>
        </div>
        <div class="info-box">
          <h2>Lines</h2>
          <p id="lines">0</p>
        </div>
        <div id="game-over-msg" class="game-over">
          GAME OVER<br>
          <span style="font-size: 12px; color: #fff;">[R] キーで再スタート</span>
        </div>
      </div>

      <div class="controls-info">
        <strong>操作方法:</strong>
        <ul>
          <li>← / → : 移動</li>
          <li>↓ : 高速落下</li>
          <li>↑ : 回転</li>
          <li>R : 再スタート</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');

    // 1ブロックあたりのピクセルサイズ (20px * 12列 = 240, 20px * 20行 = 400)
    const BLOCK_SIZE = 20;
    context.scale(BLOCK_SIZE, BLOCK_SIZE);

    // テトリミノ（ブロック）の色定義
    const COLORS = [
      null,
      '#00f0f0', // 1: I (シアン)
      '#0000f0', // 2: J (ブルー)
      '#f0a000', // 3: L (オレンジ)
      '#f0f000', // 4: O (イエロー)
      '#00f000', // 5: S (グリーン)
      '#a000f0', // 6: T (パープル)
      '#f00000'  // 7: Z (レッド)
    ];

    // テトリミノの形状パターン定義
    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'J') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [2, 2, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'S') {
        return [
          [0, 5, 5],
          [5, 5, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 0, 0],
          [6, 6, 6],
          [0, 6, 0],
        ];
      } else if (type === 'Z') {
        return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    // ゲームフィールド作成（幅12, 高さ20）
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    const arena = createMatrix(12, 20);

    // プレイヤー（操作中のブロック）データ
    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
      lines: 0,
    };

    // 衝突判定（壁・底・他のブロック）
    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // 操作中ブロックをフィールド（arena）に固定する
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // 行が揃ったかを判定し、消去＆スコア加算
    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        // 揃った行を削除し、上に新しい空行を追加
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        // スコア算出（複数同時消しでボーナス）
        player.score += rowCount * 10;
        player.lines += 1;
        rowCount *= 2;
      }
      updateScore();
    }

    // ブロック（行列）の回転処理
    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [
            matrix[x][y],
            matrix[y][x],
          ] = [
            matrix[y][x],
            matrix[x][y],
          ];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    // 左右移動
    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    // 回転時の壁めり込み防止処理（ウォールキック）
    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    // 新しいテトリミノをランダム生成して配置
    function playerReset() {
      const pieces = 'ILJOTSZ';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      // 出現直後に衝突している場合はゲームオーバー
      if (collide(arena, player)) {
        document.getElementById('game-over-msg').style.display = 'block';
        isGameOver = true;
      }
    }

    // 自然落下処理
    function playerDrop() {
      if (isGameOver) return;
      
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    // 描画関係のメイン関数
    function draw() {
      // 画面クリア
      context.fillStyle = '#111119';
      context.fillRect(0, 0, canvas.width, canvas.height);

      // 固定済みブロックと操作中ブロックの描画
      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    // 行列データを画面上に四角形として描画
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);

            // ブロックに立体感を出すための枠線
            context.lineWidth = 0.05;
            context.strokeStyle = '#ffffff';
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // スコア表示の更新
    function updateScore() {
      document.getElementById('score').innerText = player.score;
      document.getElementById('lines').innerText = player.lines;
    }

    // リセット処理（Rキー用）
    function resetGame() {
      arena.forEach(row => row.fill(0));
      player.score = 0;
      player.lines = 0;
      isGameOver = false;
      document.getElementById('game-over-msg').style.display = 'none';
      updateScore();
      playerReset();
    }

    // ゲームループ（時間の管理）
    let dropCounter = 0;
    let dropInterval = 1000; // 1秒（1000ms）ごとに1マス落下
    let lastTime = 0;
    let isGameOver = false;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    // キーボード操作の設定
    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {        // 左矢印: 移動
        playerMove(-1);
      } else if (event.keyCode === 39) { // 右矢印: 移動
        playerMove(1);
      } else if (event.keyCode === 40) { // 下矢印: 高速落下
        playerDrop();
      } else if (event.keyCode === 38) { // 上矢印: 回転
        playerRotate(1);
      } else if (event.keyCode === 82) { // Rキー: ゲームリセット
        resetGame();
      }
    });

    // 初期化およびゲームスタート
    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
