<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプル テトリス</title>
  <style>
    /* 全体デザインのスタイル設定 */
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .game-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* ゲーム画面用のキャンバス */
    canvas {
      border: 2px solid #333;
      background-color: #000;
    }

    /* スコアや操作説明を表示するパネル */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 120px;
    }

    .info-box {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 6px;
    }

    .info-box h2 {
      margin: 0 0 5px 0;
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
    }

    .info-box p {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
    }

    .controls-info {
      font-size: 12px;
      color: #aaa;
      line-height: 1.6;
    }

    .controls-info p {
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <h1>TETRIS</h1>

  <div class="game-container">
    <!-- ゲームを描画するキャンバス（200px x 400px） -->
    <canvas id="tetris" width="200" height="400"></canvas>

    <!-- スコアと操作説明のエリア -->
    <div class="sidebar">
      <div class="info-box">
        <h2>Score</h2>
        <p id="score">0</p>
      </div>
      <div class="info-box">
        <h2>Lines</h2>
        <p id="lines">0</p>
      </div>
      
      <div class="controls-info">
        <strong>操作方法:</strong>
        <p>← / → : 移動</p>
        <p>↓ : 高速落下</p>
        <p>↑ : 回転</p>
      </div>
    </div>
  </div>

  <script>
    // キャンバスとコンテキストの取得
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const linesElement = document.getElementById('lines');

    // ブロック1マスのサイズ（20x400のキャンバスに対して、10x20マス）
    const BLOCK_SIZE = 20;
    context.scale(BLOCK_SIZE, BLOCK_SIZE);

    // テトリミノ（ブロック）の色定義
    const COLORS = [
      null,
      '#FF0D72', // I: ピンク
      '#0DC2FF', // J: 水色
      '#0DFF72', // L: 黄緑
      '#F538FF', // O: 紫
      '#FF8E0D', // S: オレンジ
      '#FFE138', // T: 黄色
      '#3877FF'  // Z: 青
    ];

    // ゲームフィールドの生成 (横10 x 縦20マス)
    const arena = createMatrix(10, 20);

    // プレイヤー（落下中のブロック）のデータ
    const player = {
      pos: { x: 0, y: 0 },
      matrix: null,
      score: 0,
      lines: 0,
    };

    // 空の2次元配列を作成する関数
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    // テトリミノの形状データを作成する関数
    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [0, 2, 2],
        ];
      } else if (type === 'J') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [3, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 7, 0],
          [7, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    // 行が揃っているか確認し、削除＆スコア加算する関数
    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        // 揃った行を削除し、一番上に空の行を追加
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        // スコアと消去ライン数を計算
        player.score += rowCount * 10;
        player.lines += 1;
        rowCount *= 2;
      }
      updateScore();
    }

    // 当たり判定処理（壁や他のブロックとの衝突を調べる）
    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // 描画メイン関数
    function draw() {
      // 背景クリア
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      // 固定されたブロックと操作中のブロックを描画
      drawMatrix(arena, { x: 0, y: 0 });
      drawMatrix(player.matrix, player.pos);
    }

    // 2次元配列（行列）を描画する汎用関数
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
            
            // ブロックの枠線を描画（デザインをシャープにする）
            context.strokeStyle = '#000';
            context.lineWidth = 0.05;
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // 落下したブロックをフィールド（arena）に固定する関数
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // ブロックを下方向に進める関数
    function playerDrop() {
      player.pos.y++;
      // 衝突したら1マス戻して固定する
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    // 左右移動処理
    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    // 新しいブロックの出現処理
    function playerReset() {
      const pieces = 'ILJOTSZ';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      // 出現直後に衝突している場合はゲームオーバー（フィールドリセット）
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.lines = 0;
        updateScore();
      }
    }

    // ブロック回転処理
    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      
      // 回転時に壁に埋まるのを防ぐ（壁蹴り処理）
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    // 配列の回転計算を行う関数
    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    // 時間経過の管理変数
    let dropCounter = 0;
    let dropInterval = 1000; // 1秒ごとに自動落下
    let lastTime = 0;

    // ゲームのメインループ（毎フレーム実行）
    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    // スコアUIの更新
    function updateScore() {
      scoreElement.innerText = player.score;
      linesElement.innerText = player.lines;
    }

    // キーボード操作のイベントリスナー
    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {        // 左矢印キー
        playerMove(-1);
      } else if (event.keyCode === 39) { // 右矢印キー
        playerMove(1);
      } else if (event.keyCode === 40) { // 下矢印キー
        playerDrop();
      } else if (event.keyCode === 38) { // 上矢印キー
        playerRotate(1);
      }
    });

    // ゲーム開始処理
    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
