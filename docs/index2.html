<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Puzzle - Start to Play</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* パズルのグリッドレイアウト設定 */
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0.5rem;
        }
        /* スマホでのタップ操作を快適にする設定 */
        .tile {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>
<!-- Chosen Palette: Warm Gray & Soft Blue -->
<!-- Application Structure Plan: 
    1. 導入セクション: ゲームの説明と現在のステータス。
    2. インタラクティブ・ボード: 4x4のタイル。初期状態は「完成図」を表示し、ボタン押下で「ゲーム開始」。
    3. 動的ステータス管理: スタートボタンと連動してJavaScriptのタイマーと手数カウンターを制御。
    4. クリア通知: 完了時に記録を表示するオーバーレイ。
-->
<!-- Visualization & Content Choices: 
    - 15パズル -> 目的: 娯楽と論理的思考 -> 表現: グリッドコンポーネント。
    - 手数・タイマー -> 目的: スコアの可視化 -> 表現: 上部のバッジ表示。
    - 操作性: スマホ対応のため、タップしやすいボタンサイズと視認性の高いフォントを採用。
-->
<!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col items-center p-4">

    <div class="max-w-md w-full flex flex-col gap-6 mt-6">
        
        <!-- ヘッダーと説明 -->
        <header class="text-center">
            <h1 class="text-3xl font-bold text-stone-700 tracking-tight">15 Puzzle</h1>
            <p class="mt-2 text-stone-500 text-sm">
                「Start」を押すとシャッフルされ、計測が始まります。
            </p>
        </header>

        <!-- ステータス表示（手数と経過時間） -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-200 text-center">
                <div class="text-[10px] text-stone-400 uppercase font-bold tracking-widest mb-1">Moves</div>
                <div id="move-count" class="text-2xl font-mono font-bold text-blue-600">0</div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-200 text-center">
                <div class="text-[10px] text-stone-400 uppercase font-bold tracking-widest mb-1">Time</div>
                <div id="timer" class="text-2xl font-mono font-bold text-blue-600">0:00</div>
            </div>
        </div>

        <!-- メイン・パズルボード -->
        <div class="bg-stone-200 p-3 rounded-2xl shadow-inner aspect-square w-full relative">
            <div id="puzzle-board" class="puzzle-grid h-full w-full">
                <!-- JavaScriptでタイルが挿入されます -->
            </div>
            
            <!-- クリア時のメッセージ画面 -->
            <div id="clear-message" class="hidden absolute inset-0 bg-white/95 rounded-2xl flex flex-col items-center justify-center text-center p-6 z-10 animate-in fade-in duration-300">
                <div class="text-5xl mb-4">🏆</div>
                <h2 class="text-2xl font-bold text-stone-800">Perfect!</h2>
                <p id="final-stats" class="text-stone-600 mt-2 text-lg"></p>
                <button onclick="startGame()" class="mt-6 bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
                    Play Again
                </button>
            </div>
        </div>

        <!-- コントロールセクション -->
        <div class="flex justify-center mt-2">
            <button id="start-btn" onclick="startGame()" class="bg-stone-800 text-stone-100 px-10 py-4 rounded-2xl font-bold shadow-xl hover:bg-stone-700 active:scale-95 transition-all w-full md:w-auto">
                Shuffle & Start
            </button>
        </div>

    </div>

    <script>
        // 基本設定
        const SIZE = 4;
        let board = [];
        let moves = 0;
        let seconds = 0;
        let timerInterval = null;
        let isGameStarted = false;

        // 初期表示用の盤面（完成図）を生成
        function initDisplay() {
            // 1から15までを並べ、最後を0（空白）にする
            board = Array.from({length: SIZE * SIZE}, (_, i) => (i + 1) % (SIZE * SIZE));
            renderBoard();
        }

        // ゲームを開始する関数（ボタンクリックで実行）
        function startGame() {
            // 状態のリセット
            moves = 0;
            seconds = 0;
            isGameStarted = true;
            document.getElementById('move-count').innerText = moves;
            document.getElementById('timer').innerText = "0:00";
            document.getElementById('clear-message').classList.add('hidden');
            document.getElementById('start-btn').innerText = "Restart Game";
            
            // 盤面をシャッフル
            shuffleBoard();
            renderBoard();
            
            // 【重要】ここでタイマーを開始
            startTimer();
        }

        // タイマーのカウント処理
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        // シャッフルロジック（解ける組み合わせを保証するために、正解からランダムに動かす）
        function shuffleBoard() {
            let emptyIdx = board.indexOf(0);
            for (let i = 0; i < 200; i++) {
                const neighbors = getNeighbors(emptyIdx);
                const moveIdx = neighbors[Math.floor(Math.random() * neighbors.length)];
                [board[emptyIdx], board[moveIdx]] = [board[moveIdx], board[emptyIdx]];
                emptyIdx = moveIdx;
            }
        }

        // 移動可能な隣接タイルのインデックスを取得
        function getNeighbors(idx) {
            const neighbors = [];
            const r = Math.floor(idx / SIZE);
            const c = idx % SIZE;

            if (r > 0) neighbors.push(idx - SIZE); // 上
            if (r < SIZE - 1) neighbors.push(idx + SIZE); // 下
            if (c > 0) neighbors.push(idx - 1); // 左
            if (c < SIZE - 1) neighbors.push(idx + 1); // 右
            
            return neighbors;
        }

        // ボードのHTML要素を生成して表示
        function renderBoard() {
            const container = document.getElementById('puzzle-board');
            container.innerHTML = '';

            board.forEach((val, idx) => {
                const tile = document.createElement('div');
                tile.className = 'tile flex items-center justify-center rounded-xl font-bold text-2xl transition-all duration-150 ';
                
                if (val === 0) {
                    // 空白タイルのデザイン
                    tile.classList.add('bg-stone-300/40');
                } else {
                    // 数字タイルのデザイン
                    tile.classList.add('bg-white', 'text-stone-700', 'shadow-md', 'border-b-4', 'border-stone-200');
                    if (isGameStarted) {
                        tile.classList.add('cursor-pointer', 'hover:bg-blue-50', 'active:translate-y-1', 'active:border-b-0');
                        tile.onclick = () => handleTileClick(idx);
                    }
                    tile.innerText = val;
                }
                
                container.appendChild(tile);
            });
        }

        // タイルがクリックされた時の動作
        function handleTileClick(idx) {
            if (!isGameStarted) return;

            const emptyIdx = board.indexOf(0);
            const neighbors = getNeighbors(idx);

            // 空白に隣接していれば移動可能
            if (neighbors.includes(emptyIdx)) {
                [board[idx], board[emptyIdx]] = [board[emptyIdx], board[idx]];
                moves++;
                document.getElementById('move-count').innerText = moves;
                renderBoard();
                checkClear();
            }
        }

        // 全てのタイルが正しい位置にあるか確認
        function checkClear() {
            const isCleared = board.every((val, i) => {
                if (i === SIZE * SIZE - 1) return val === 0;
                return val === i + 1;
            });

            if (isCleared) {
                isGameStarted = false;
                clearInterval(timerInterval);
                
                const clearMsg = document.getElementById('clear-message');
                const stats = document.getElementById('final-stats');
                const timeText = document.getElementById('timer').innerText;
                stats.innerText = `${moves} Moves / ${timeText}`;
                clearMsg.classList.remove('hidden');
            }
        }

        // ページ読み込み時は完成図だけ見せる
        window.onload = initDisplay;
    </script>
</body>
</html>
