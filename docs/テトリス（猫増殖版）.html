<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Pastel Cute Tetris - Growing Cats</title>
  <style>
    body {
      background: #fdf2f8;
      color: #5b4b62;
      font-family: 'Quicksand', 'Nunito', 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      background: #ffffff;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(221, 180, 208, 0.4);
      border: 4px solid #fbcfe8;
    }
    .canvas-wrapper {
      position: relative;
    }
    canvas {
      background: #fff5f8;
      border: 3px solid #f472b6;
      border-radius: 16px;
      box-shadow: inset 0 0 12px rgba(244, 114, 182, 0.15);
      display: block;
    }
    /* ポーズ画面のオーバーレイ */
    .pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 245, 248, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .pause-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .pause-title {
      font-size: 26px;
      font-weight: bold;
      color: #f472b6;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(244, 114, 182, 0.2);
      margin-bottom: 8px;
    }
    .pause-sub {
      font-size: 12px;
      color: #9d8ba7;
    }
    .info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 180px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      align-self: flex-start;
      color: #f472b6;
      letter-spacing: 1px;
    }
    .score-box {
      font-size: 16px;
      align-self: flex-start;
      background: #fdf2f8;
      width: 100%;
      padding: 10px;
      border-radius: 14px;
      box-sizing: border-box;
      border: 2px solid #fbcfe8;
      color: #9d8ba7;
      font-weight: bold;
    }
    .score-box span {
      color: #f472b6;
      float: right;
      font-size: 18px;
    }
    .controls {
      font-size: 12px;
      color: #8c7a99;
      line-height: 1.5;
      align-self: flex-start;
      background: #fdf2f8;
      width: 100%;
      padding: 10px;
      border-radius: 14px;
      box-sizing: border-box;
      border: 2px solid #fbcfe8;
    }
    .controls strong {
      color: #f472b6;
    }

    /* 猫が集まるエリア */
    .cat-yard {
      width: 100%;
      min-height: 120px;
      max-height: 160px;
      padding: 4px 0;
      box-sizing: border-box;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
      overflow-y: auto;
    }

    .cat-character {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 2px 4px rgba(244, 114, 182, 0.2));
      animation: catPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes catPop {
      0% { transform: scale(0) rotate(-15deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="tetris" width="240" height="400"></canvas>
    <div id="pause-overlay" class="pause-overlay">
      <div class="pause-title">PAUSED</div>
      <div class="pause-sub">P または Esc で再開</div>
    </div>
  </div>
  
  <div class="info">
    <h1>TETRIS</h1>
    <div class="score-box">スコア <span id="score">0</span></div>
    <div class="controls">
      <strong>操作方法:</strong><br>
      ← / → : 移動<br>
      ↑ / Space : 回転<br>
      ↓ : ソフトドロップ<br>
      <strong>P / Esc : 一時停止</strong>
    </div>
    
    <!-- 猫が集まるエリア -->
    <div id="cat-yard" class="cat-yard"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const pauseOverlay = document.getElementById('pause-overlay');
const catYard = document.getElementById('cat-yard');

context.scale(20, 20);

const particles = [];
const flashes = [];
let isPaused = false;

const CAT_COLORS = [
  { body: '#ffb7b2', ear: '#ffd1dc' }, // ピンク
  { body: '#ffdac1', ear: '#ffe5d9' }, // ピーチ
  { body: '#bdb2ff', ear: '#e7c6ff' }, // ラベンダー
  { body: '#b5ead7', ear: '#c7f9cc' }, // ミント
  { body: '#a2d2ff', ear: '#d4e6ff' }, // スカイブルー
  { body: '#fff3b0', ear: '#fffae0' }  // イエロー
];

const SHAPES = [
  [],
  [[0, 0, 0], [1, 1, 1], [0, 1, 0]], // T
  [[0, 2, 2], [2, 2, 0], [0, 0, 0]], // S
  [[3, 3, 0], [0, 3, 3], [0, 0, 0]], // Z
  [[4, 4], [4, 4]],                   // O
  [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]], // I
  [[6, 0, 0], [6, 6, 6], [0, 0, 0]], // L
  [[0, 0, 7], [7, 7, 7], [0, 0, 0]]  // J
];

const COLORS = [
  null,
  '#c7ceea',
  '#b5ead7',
  '#ff9aa2',
  '#ffdac1',
  '#e2f0cb',
  '#ffb7b2',
  '#a2d2ff'
];

const arena = Array(20).fill().map(() => Array(12).fill(0));

const player = {
  pos: {x: 0, y: 0},
  matrix: null,
  score: 0
};

function addCat() {
  const color = CAT_COLORS[Math.floor(Math.random() * CAT_COLORS.length)];
  const catSvg = `
    <svg class="cat-character" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="20,40 32,15 45,32" fill="${color.body}" />
      <polygon points="80,40 68,15 55,32" fill="${color.body}" />
      <polygon points="23,38 32,20 42,32" fill="${color.ear}" />
      <polygon points="77,38 68,20 58,32" fill="${color.ear}" />
      <ellipse cx="50" cy="50" rx="35" ry="28" fill="${color.body}" />
      <ellipse cx="38" cy="46" rx="4" ry="6" fill="#5b4b62" />
      <ellipse cx="62" cy="46" rx="4" ry="6" fill="#5b4b62" />
      <circle cx="36" cy="44" r="1.5" fill="#FFFFFF" />
      <circle cx="60" cy="44" r="1.5" fill="#FFFFFF" />
      <ellipse cx="30" cy="54" rx="5" ry="3" fill="#ff9aa2" opacity="0.8" />
      <ellipse cx="70" cy="54" rx="5" ry="3" fill="#ff9aa2" opacity="0.8" />
      <polygon points="48,52 52,52 50,55" fill="#e07a5f" />
      <path d="M 45 57 Q 50 62 50 57 Q 50 62 55 57" stroke="#5b4b62" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <line x1="18" y1="48" x2="30" y2="50" stroke="#5b4b62" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="55" x2="29" y2="54" stroke="#5b4b62" stroke-width="1.5" stroke-linecap="round" />
      <line x1="82" y1="48" x2="70" y2="50" stroke="#5b4b62" stroke-width="1.5" stroke-linecap="round" />
      <line x1="84" y1="55" x2="71" y2="54" stroke="#5b4b62" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 32 72 Q 25 95 38 95 L 62 95 Q 75 95 68 72 Z" fill="${color.body}" />
      <ellipse cx="50" cy="85" rx="12" ry="8" fill="#fff5f8" />
      <ellipse cx="42" cy="92" rx="4" ry="5" fill="#FFFFFF" />
      <ellipse cx="58" cy="92" rx="4" ry="5" fill="#FFFFFF" />
    </svg>
  `;
  catYard.insertAdjacentHTML('beforeend', catSvg);
  catYard.scrollTop = catYard.scrollHeight;
}

function clearCats() {
  catYard.innerHTML = '';
}

function togglePause() {
  isPaused = !isPaused;
  if (isPaused) {
    pauseOverlay.classList.add('active');
  } else {
    pauseOverlay.classList.remove('active');
    lastTime = performance.now();
  }
}

function collide(arena, player) {
  const [m, o] = [player.matrix, player.pos];
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function merge(arena, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        arena[y + player.pos.y][x + player.pos.x] = value;
      }
    });
  });
}

// パティクル生成処理の派手化
function createSparklesForRow(yIndex) {
  flashes.push({ y: yIndex, alpha: 1.0 });

  const sparkColors = ['#ffffff', '#ffb7b2', '#ffc6ff', '#bdb2ff', '#a0c4ff', '#9bf6ff', '#caffbf', '#fdffb6'];
  const shapes = ['star', 'heart', 'circle', 'diamond'];
  
  // パーティクル数を35個から100個に大幅増加
  for (let i = 0; i < 100; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x: Math.random() * 240,
      y: yIndex * 20 + 10 + (Math.random() * 12 - 6),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.2, // ふんわり舞い上がる
      size: Math.random() * 6 + 3,
      color: sparkColors[Math.floor(Math.random() * sparkColors.length)],
      alpha: 1.0,
      decay: Math.random() * 0.02 + 0.01,
      rotation: Math.random() * Math.PI,
      vRot: (Math.random() - 0.5) * 0.3,
      shape: shapes[Math.floor(Math.random() * shapes.length)]
    });
  }
}

function arenaSweep() {
  let rowCount = 1;
  outer: for (let y = arena.length - 1; y > 0; --y) {
    for (let x = 0; x < arena[y].length; ++x) {
      if (arena[y][x] === 0) continue outer;
    }
    
    createSparklesForRow(y);
    addCat();

    const row = arena.splice(y, 1)[0].fill(0);
    arena.unshift(row);
    ++y;

    player.score += rowCount * 10;
    rowCount *= 2;
  }
  updateScore();
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; ++y) {
    for (let x = 0; x < y; ++x) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerRotate(dir) {
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
}

function playerReset() {
  const pieces = '1234567';
  player.matrix = SHAPES[pieces[pieces.length * Math.random() | 0]];
  player.pos.y = 0;
  player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

  if (collide(arena, player)) {
    arena.forEach(row => row.fill(0));
    player.score = 0;
    clearCats();
    updateScore();
  }
}

function playerDrop() {
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    merge(arena, player);
    playerReset();
    arenaSweep();
  }
  dropCounter = 0;
}

function playerMove(dir) {
  player.pos.x += dir;
  if (collide(arena, player)) {
    player.pos.x -= dir;
  }
}

function draw() {
  context.fillStyle = '#fff5f8';
  context.fillRect(0, 0, canvas.width, canvas.height);

  drawMatrix(arena, {x: 0, y: 0});
  drawMatrix(player.matrix, player.pos);

  drawEffects();
}

function drawMatrix(matrix, offset) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        context.fillStyle = COLORS[value];
        context.fillRect(x + offset.x, y + offset.y, 1, 1);
        
        context.strokeStyle = '#ffffff';
        context.lineWidth = 0.08;
        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
      }
    });
  });
}

// 描画エフェクトのアップグレード
function drawEffects() {
  context.save();
  context.setTransform(1, 0, 0, 1, 0, 0);

  // 消去ラインの多重グラデーションフラッシュ
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    if (!isPaused) f.alpha -= 0.03;
    if (f.alpha <= 0) {
      flashes.splice(i, 1);
    } else {
      context.save();
      const grad = context.createLinearGradient(0, f.y * 20, 240, f.y * 20 + 20);
      grad.addColorStop(0, `rgba(255, 255, 255, ${f.alpha})`);
      grad.addColorStop(0.5, `rgba(254, 205, 232, ${f.alpha * 0.9})`);
      grad.addColorStop(1, `rgba(255, 255, 255, ${f.alpha})`);
      
      context.fillStyle = grad;
      context.shadowColor = '#f472b6';
      context.shadowBlur = 16;
      context.fillRect(0, f.y * 20 - 2, 240, 24);
      context.restore();
    }
  }

  // 多彩な形状のキラキラ粒子描画
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (!isPaused) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04; // 軽やかな重力感
      p.alpha -= p.decay;
      p.rotation += p.vRot;
    }

    if (p.alpha <= 0) {
      particles.splice(i, 1);
    } else {
      context.save();
      context.globalAlpha = p.alpha;
      context.fillStyle = p.color;
      context.shadowColor = p.color;
      context.shadowBlur = 8; // グロー効果（発光）を強調

      context.translate(p.x, p.y);
      context.rotate(p.rotation);

      const s = p.size;
      context.beginPath();

      if (p.shape === 'star') {
        // 4角のキラキラ星
        context.moveTo(0, -s);
        context.quadraticCurveTo(0, 0, s, 0);
        context.quadraticCurveTo(0, 0, 0, s);
        context.quadraticCurveTo(0, 0, -s, 0);
        context.quadraticCurveTo(0, 0, 0, -s);
      } else if (p.shape === 'heart') {
        // パステルハート
        context.moveTo(0, s * 0.3);
        context.bezierCurveTo(-s, -s * 0.5, -s * 0.5, -s, 0, -s * 0.4);
        context.bezierCurveTo(s * 0.5, -s, s, -s * 0.5, 0, s * 0.3);
      } else if (p.shape === 'diamond') {
        // ひし形
        context.moveTo(0, -s);
        context.lineTo(s * 0.7, 0);
        context.lineTo(0, s);
        context.lineTo(-s * 0.7, 0);
      } else {
        // まあるい光のコメット
        context.arc(0, 0, s * 0.6, 0, Math.PI * 2);
      }

      context.closePath();
      context.fill();

      context.restore();
    }
  }

  context.restore();
}

function updateScore() {
  scoreElement.innerText = player.score;
}

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;

function update(time = 0) {
  const deltaTime = time - lastTime;
  lastTime = time;

  if (!isPaused) {
    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
      playerDrop();
    }
  }

  draw();
  requestAnimationFrame(update);
}

document.addEventListener('keydown', event => {
  if (event.keyCode === 80 || event.keyCode === 27) {
    togglePause();
    return;
  }

  if (isPaused) return;

  if (event.keyCode === 37) {
    playerMove(-1);
  } else if (event.keyCode === 39) {
    playerMove(1);
  } else if (event.keyCode === 40) {
    playerDrop();
  } else if (event.keyCode === 38 || event.keyCode === 32) {
    playerRotate(1);
    event.preventDefault();
  }
});

clearCats();
playerReset();
updateScore();
update();
</script>
</body>
</html>
